# riscv-formal configuration for the RV32I-Alpha core.
# Used by formal/run.sh, which replaces @repo@ with the repository path.

[options]
isa rv32i
nret 1
solver yices

[depth]
insn            10
reg        5    10
pc_fwd     5    10
pc_bwd     5    10
liveness   1 5  15
unique     1 5  10
causal     5    10
cover      1    10
ill             10

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RV32I_ALPHA_PORT_CHECKS

[defines liveness]
`define RV32I_ALPHA_FAIRNESS

[verilog-files]
@repo@/formal/wrapper.sv

[script-sources]
plugin -i ghdl
ghdl --std=08 -gFORMAL=true @repo@/src/ALU.vhd @repo@/src/ALU_decoder.vhd @repo@/src/Main_decoder.vhd @repo@/src/Imm_gen.vhd @repo@/src/Load_store_unit.vhd @repo@/src/Register_file.vhd @repo@/src/core.vhd -e rv32i_core

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
